name: Release

# Push a tag like v0.2.0 to publish a release:
#   git tag v0.2.0 && git push origin v0.2.0
#
# Secrets (all optional, each step is skipped without its secret):
#   SPARKLE_PRIVATE_KEY  EdDSA private key from Sparkle's `generate_keys -x` (enables auto-updates)
#   SPARKLE_PUBLIC_KEY   the matching public key (baked into the app)
#   TAP_TOKEN            token with write access to Pardival/homebrew-tap (updates the cask)

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE/Contents/Developer"

      - name: Tools
        run: brew install xcodegen create-dmg

      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        working-directory: Packages/FlitchKit
        run: swift test --parallel

      - name: Build DMG
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: ./scripts/build-dmg.sh "${{ steps.v.outputs.version }}"

      - name: Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: |
          SPARKLE_BIN=$(find build/DerivedData/SourcePackages/artifacts -type d -path "*Sparkle*/bin" | head -1)
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/ed25519"
          mkdir -p build/appcast
          cp build/release/Flitch-*.dmg build/appcast/
          "$SPARKLE_BIN/generate_appcast" --ed-key-file "$RUNNER_TEMP/ed25519" \
            --download-url-prefix "https://github.com/Pardival/flitch/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/Pardival/flitch" -o build/release/appcast.xml build/appcast
          rm "$RUNNER_TEMP/ed25519"

      - name: Release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Install"
            echo
            echo "Download **Flitch-${{ steps.v.outputs.version }}.dmg**, drag Flitch to Applications, then follow the"
            echo "[install guide](https://github.com/Pardival/flitch/blob/main/docs/install.md) (the app isn't notarized:"
            echo "*System Settings → Privacy & Security → Open Anyway*)."
            echo
            echo "Or with Homebrew: \`brew install pardival/tap/flitch\`"
            echo
            echo "SHA-256: \`$(cat build/release/Flitch-*.dmg.sha256)\`"
            echo
            echo "## Changes"
            echo
            git log --pretty='- %s' ${PREV:+$PREV..}HEAD | grep -v '^- Merge '
          } > build/release/NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Flitch ${{ steps.v.outputs.version }}" \
            --notes-file build/release/NOTES.md \
            build/release/Flitch-*.dmg build/release/Flitch-*.dmg.sha256 \
            $( [ -f build/release/appcast.xml ] && echo build/release/appcast.xml )

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        if: env.TAP_TOKEN != ''
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          SHA=$(cat build/release/Flitch-*.dmg.sha256)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/Pardival/homebrew-tap.git" tap
          mkdir -p tap/Casks
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA/" packaging/homebrew/flitch.rb.template > tap/Casks/flitch.rb
          cd tap
          git config user.name "flitch-release"
          git config user.email "flitch-release@users.noreply.github.com"
          git add Casks/flitch.rb
          git commit -m "flitch $VERSION"
          git push
