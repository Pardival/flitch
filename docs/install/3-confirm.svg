<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <rect width="520" height="300" fill="#eceae6"/>
  <rect x="110" y="30" width="300" height="240" rx="18" fill="#fff" stroke="#d0cdc8"/>
  <circle cx="260" cy="82" r="28" fill="#f4c542"/>
  <text x="260" y="93" font-size="34" font-weight="700" text-anchor="middle" fill="#fff">!</text>
  <text x="260" y="138" font-size="15" font-weight="700" text-anchor="middle" fill="#222">Open “Flitch”?</text>
  <text x="260" y="162" font-size="11" text-anchor="middle" fill="#555">Apple could not verify “Flitch” is free of malware.</text>
  <text x="260" y="177" font-size="11" text-anchor="middle" fill="#555">Your Mac password or Touch ID is asked next.</text>
  <rect x="135" y="205" width="250" height="26" rx="7" fill="#0B7D71"/>
  <text x="260" y="222" font-size="12" font-weight="600" text-anchor="middle" fill="#fff">Open Anyway</text>
  <rect x="135" y="236" width="250" height="26" rx="7" fill="#e6e4e0"/>
  <text x="260" y="253" font-size="12" text-anchor="middle" fill="#222">Cancel</text>
  <circle cx="400" cy="218" r="14" fill="#e05a47"/>
  <text x="400" y="223" font-size="14" font-weight="700" text-anchor="middle" fill="#fff">4</text>
</svg>
