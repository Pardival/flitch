name: Flitch
options:
  bundleIdPrefix: app.flitch
  knownRegions: [en, fr, es, Base]
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  FlitchKit:
    path: Packages/FlitchKit
targets:
  Flitch:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Characters
        type: folder
        buildPhase: resources
    dependencies:
      - package: FlitchKit
        product: FlitchCore
      - package: FlitchKit
        product: FlitchProviders
      - package: FlitchKit
        product: FlitchVoice
      - package: FlitchKit
        product: FlitchMemory
      - package: FlitchKit
        product: FlitchCharacter
      - package: FlitchKit
        product: FlitchStage
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Flitch
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: Flitch listens only while you hold the talk shortcut.
        NSSpeechRecognitionUsageDescription: Flitch transcribes your voice on your Mac to understand your question.
        NSHumanReadableCopyright: "© 2026 The Flitch contributors. MIT licence."
    entitlements:
      path: App/Flitch.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.flitch.Flitch
        PRODUCT_NAME: Flitch
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  Flitch:
    build:
      targets:
        Flitch: all
    run:
      config: Debug
